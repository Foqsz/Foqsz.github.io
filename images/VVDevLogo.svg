<svg width="420" height="140" viewBox="0 0 420 140" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <!-- Distorção orgânica -->
    <filter id="distort">
      <feTurbulence type="turbulence" baseFrequency="0.02" numOctaves="1" result="noise"/>
      <feDisplacementMap in="SourceGraphic" in2="noise" scale="14"/>
    </filter>
  </defs>

  <rect width="100%" height="100%" fill="transparent"/>

  <text
    x="50%"
    y="55%"
    text-anchor="middle"
    dominant-baseline="middle"
    font-family="Playwrite Österreich, cursive"
    font-size="72"
    font-weight="400"
    fill="#FFFFFF"
    filter="url(#distort)">
    VV Dev
  </text>
</svg>
